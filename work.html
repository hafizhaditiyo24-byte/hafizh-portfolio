<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="icon" type="image/png" href="/fav-icon.png?v=2">

  <title>Work — Hafizh</title>

  <link rel="stylesheet" href="/src/work.css">
</head>

<body>

  <canvas id="webgl-gallery" aria-hidden="true"></canvas>
  <main
    id="stage"
    tabindex="0"
    aria-label="Gallery. Drag, scroll or use the arrow keys to move around."
  ></main>

  <p id="hint" class="ui">(Drag anywhere)</p>

  <script type="module" src="/src/work.js"></script>

</body>
<svg
  width="0"
  height="0"
  aria-hidden="true"
  style="position:absolute"
>
  <filter id="fisheye">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.012"
      numOctaves="1"
      seed="2"
      result="noise"
    />

    <feDisplacementMap
      in="SourceGraphic"
      in2="noise"
      scale="0"
      xChannelSelector="R"
      yChannelSelector="G"
    />
  </filter>
</svg>
</html>
